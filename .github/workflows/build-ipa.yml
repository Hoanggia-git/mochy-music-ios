name: Build Unsigned iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS app (unsigned)
        run: |
          xcodebuild \
            -project MochyMusic.xcodeproj \
            -scheme MochyMusic \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package unsigned .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MochyMusic.app Payload/
          zip -r MochyMusic-unsigned.ipa Payload

      - name: Upload MochyMusic-unsigned.ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: MochyMusic-unsigned-ipa
          path: MochyMusic-unsigned.ipa
          if-no-files-found: error
