name: MochyMusic
options:
  bundleIdPrefix: com.mochyy
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""

targets:
  MochyMusic:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: MochyMusic
        excludes:
          - "**/*.md"
          - "Info.plist"
    info:
      path: MochyMusic/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mochyy.mochymusic.ios
        PRODUCT_NAME: MochyMusic
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        INFOPLIST_FILE: MochyMusic/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
