name: MochyMusic
options:
  bundleIdPrefix: com.mochyy
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    ENABLE_BITCODE: "NO"

targets:
  MochyMusic:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: MochyMusic
        excludes:
          - Info.plist
          - "*.md"
    info:
      path: MochyMusic/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mochyy.mochymusic
        PRODUCT_NAME: MochyMusic
        INFOPLIST_FILE: MochyMusic/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
    scheme:
      testTargets: []
